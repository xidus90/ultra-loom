# generated from .ultraloom/answers.toml -- edit that and re-run init
[project]
commit_language = "en"

# No coverage check, and no [verify.coverage] here on purpose. At the time
# `init` ran, nothing in this project could make a coverage run fail: neither
# `fail_under` under [tool.coverage.report] in pyproject.toml nor one in
# .coveragerc. A check over that configuration reports a number and passes
# whatever the number is, and a lane that cannot go red is worse than none.
# Set fail_under and re-run `ultraloom init` to get the check.

[verify.profiles]
edit      = ["lint", "types"]
precommit = ["lint", "types", "test"]

# Which checks a changed path is worth. An extension that does not appear here
# draws the full chain: a gate that skips checks unnoticed is worse than none.
[relevance]
"*.md" = []
"*.py" = ["lint", "types"]


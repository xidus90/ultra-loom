# ultraloom prüft sich mit seinem eigenen Werkzeug. Nur `lint` steht hier: das
# Preset greift zu `uvx ruff` und bekommt damit die Version, die uvx gerade
# holt, während `uv run` die Entwicklungsabhängigkeit auflöst, die dieses
# Projekt festnagelt — dieselbe ruff-Version also, die auch die Gates fahren.
# `types` und `test` fehlen mit Absicht: das Preset trifft dort bereits zu, und
# ein Eintrag, der es wiederholt, verliert stillschweigend, was daran hängt —
# bei `test` die Messung, die `coverage` im selben Lauf mitnimmt.
[verify]
lint = "uv run ruff check ."

# Was der Reparateur nicht anfassen darf. `pyproject.toml` steht neben den
# Tests, weil dort die Schwellen wohnen: eine gelockerte ruff-Regel oder ein
# gesenktes `fail_under` ist derselbe Betrug wie ein abgeschwächter Test. Der
# Prompt verbietet das zwar, aber ein Verbot im Prompt ist eine Bitte --
# `guard` ist die Mechanik.
tests = ["tests/", "pyproject.toml"]

[verify.coverage]
threshold = 100

[verify.profiles]
edit      = ["lint", "types"]
precommit = ["lint", "types", "test", "coverage"]

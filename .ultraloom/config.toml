# ultraloom checks itself with its own tool. Only `lint` stands here: the preset
# reaches for `uvx ruff` and thereby gets whichever version uvx happens to
# fetch, whereas `uv run` resolves the development dependency this project
# pins -- the same ruff version the gates run, then.
# `test` is named although the preset would get Python right on its own: since
# 2026-08-28 the repository holds a second language, and a kind takes either the
# preset or the configured list -- there is no appending to a preset. The cost is
# known and accepted: with `test` configured, `coverage` no longer reads what the
# suite left behind but falls back on its own measuring run, so `precommit` runs
# pytest twice. A green report over stale data is the one thing this must not
# buy, and it does not.
#
# `gofmt -l` prints the unformatted files and *exits 0* even then, so it cannot
# be a gate entry by itself; `hooks/gofmt-check.py` turns that output into an
# exit code. In Python and not in bash, because the gate spawns whichever `bash`
# PATH names first, and on this machine that is WSL's -- from there a Windows
# gofmt cannot be reached by its bare name, and the lane failed with
# `command not found` while `go vet` beside it ran fine.
# It is given `cmd` alone: `internal/` does not exist yet, and gofmt does not
# shrug at a missing path -- it exits 2. The task that creates `internal/` adds
# it here.
#
# `types` is named only to trade mypy for its daemon. A/B over this hook's own
# post-edit path, back to back on 2026-08-27: warm 1400 ms -> 988 ms, cold
# 9.6 s -> 9.1 s. Back to back matters -- the first attempt at this
# measurement ran while the machine was busy and said the opposite, with
# spreads wide enough to hide the whole effect.
#
# Still `uv run` and not a shim from `uv tool install`: that is what pins the
# version. A globally installed mypy would judge this project by whatever
# version the machine happens to carry, and the gate would drift from the
# development dependency without anyone editing a line. The same reason keeps
# `lint` on `uv run`.
#
# `run --` rather than `check`, because that form restarts the daemon by itself
# when the flags behind it change; a daemon still judging by the previous
# settings is worse than no daemon.
[verify]
types = "uv run dmypy run -- --no-error-summary --no-pretty"

# What the repairer must not touch. `pyproject.toml` stands beside the tests
# because the thresholds live there: a loosened ruff rule or a lowered
# `fail_under` is the same cheat as a weakened test. The prompt forbids it, yes,
# but a prohibition in a prompt is a request -- `guard` is the mechanism.
tests = ["tests/", "pyproject.toml"]

# The table form, because both languages have to run under one kind. `threaded`
# because the commands of a kind are equal-ranking and independent: they all run
# even after a red one, so running them side by side changes nothing but the
# wall clock.
[verify.lint]
commands = [
  "uv run ruff check .",
  "uv run --script hooks/gofmt-check.py cmd",
  "go vet ./...",
]
threaded = true

[verify.test]
commands = ["uv run pytest", "go test ./..."]
threaded = true

[verify.coverage]
threshold = 100

[verify.profiles]
edit      = ["lint", "types"]
precommit = ["lint", "types", "test", "coverage"]

# This repo under its own policy. Both rules have a history here: a subagent
# once pushed `master` without being asked, and a journal edited after the fact
# takes replay's whole point away.
# The hook state joins them for the same kind of reason: an agent that resets
# its own block counter has abolished the stop gate.
# The expressions sit in TOML literal strings ('...'): in a basic string every
# backslash would have to be doubled, and a forgotten one quietly turns `\s`
# into `s` -- the rule would then only bite on exactly one space.
# And they are not anchored with `^` alone: the whole command line is checked
# without `MULTILINE`, so `^git push` would let through precisely the form this
# is about -- `git commit -m … && git push`.
# Both shells are covered by one rule: `Bash` and `PowerShell` alike yield a
# subject of kind `commands`, so nothing here needs saying twice.
[[policy.paths.rules]]
match  = [".ultraloom/runs/*", "uv.lock", ".coverage"]
reason = "An edited journal destroys what replay exists for; the lock belongs to uv."

# A rule of its own rather than another pattern on the one above: the reason is
# what an agent reads when it is refused, and being told about journals and
# lock files while reaching for its own block counter would send it looking in
# the wrong place.
[[policy.paths.rules]]
match  = ".ultraloom/hooks/*"
reason = "This is the stop gate's own block counter; resetting it abolishes the gate."

[[policy.commands.rules]]
regex  = '(^|[\n;&|(`])\s*git\s+push(?![\w-])'
reason = "Whether commits reach the remote is a human's decision (CLAUDE.md)."

[[policy.commands.rules]]
regex  = '(^|[\n;&|(`])\s*pip\s+install(?![\w-])'
reason = "This project uses uv, never pip."

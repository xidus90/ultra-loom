# ultraloom prüft sich mit seinem eigenen Werkzeug. Diese Kommandos sind nicht
# das ausgeschriebene Python-Preset: das Preset greift zu `uvx ruff` und
# `uvx mypy` und bekommt damit die Version, die uvx gerade holt. `uv run` löst
# die Entwicklungsabhängigkeiten auf, die dieses Projekt festnagelt — die
# Prüfungen des Ablaufs sind also dieselben, die auch die Gates fahren.
[verify]
lint  = "uv run ruff check ."
types = "uv run mypy"
test  = "uv run pytest"

# Was der Reparateur nicht anfassen darf. `pyproject.toml` steht neben den
# Tests, weil dort die Schwellen wohnen: eine gelockerte ruff-Regel oder ein
# gesenktes `fail_under` ist derselbe Betrug wie ein abgeschwächter Test. Der
# Prompt verbietet das zwar, aber ein Verbot im Prompt ist eine Bitte --
# `guard` ist die Mechanik.
tests = ["tests/", "pyproject.toml"]

[verify.coverage]
threshold = 100

[verify.profiles]
edit      = ["lint", "types"]
precommit = ["lint", "types", "test", "coverage"]

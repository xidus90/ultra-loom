# ultraloom checks itself with its own tool. These commands are not the Python
# preset spelled out: the preset reaches for `uvx ruff` and `uvx mypy`, which
# resolve to whatever version uvx happens to fetch. `uv run` resolves the dev
# dependencies this project pins, so the checks the flow runs are the same ones
# the gates run.
[verify]
lint  = "uv run ruff check ."
types = "uv run mypy"
test  = "uv run pytest"

# Was der Reparateur nicht anfassen darf. `pyproject.toml` steht neben den
# Tests, weil dort die Schwellen wohnen: eine gelockerte ruff-Regel oder ein
# gesenktes `fail_under` ist derselbe Betrug wie ein abgeschwächter Test. Der
# Prompt verbietet das zwar, aber ein Verbot im Prompt ist eine Bitte --
# `guard` ist die Mechanik.
tests = ["tests/", "pyproject.toml"]

[verify.coverage]
threshold = 100

[verify.profiles]
edit      = ["lint", "types"]
precommit = ["lint", "types", "test", "coverage"]

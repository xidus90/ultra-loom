[project]
name = "ultraloom"
version = "0.1.0"
description = "A check chain for linters and tests, and an optional graph harness for agent flows"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# The harness needs the Claude Agent SDK; the check chain must not. Pinned to
# the exact version, because the wheel decides whether the agent path runs at
# all: 0.2.144 shipped no win_amd64 wheel, so Windows installs the
# platform-independent one, which bundles no claude.exe. A lower bound would
# not have caught that -- the *newer* release was the broken one.
agent = ["claude-agent-sdk==0.2.143"]

[project.scripts]
ultraloom = "ultraloom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage[toml]>=7",
    "claude-agent-sdk==0.2.143",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultraloom"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Plan documents carry Python fragments that are deliberately not valid
# modules: indented insert pieces and bare comma lists. Formatting them
# destroys the very information they carry.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
# The contract test talks to the real Claude Agent SDK over the network. It
# stays out of the default run and is asked for explicitly with `-m contract`.
markers = ["contract: runs against the real Claude Agent SDK; excluded from the default run"]
addopts = "-m 'not contract'"

[tool.coverage.run]
branch = true
source = ["src/ultraloom"]

[tool.coverage.report]
fail_under = 100
show_missing = true
